spring.application.name=cuentas-crud
server.port=${PORT:8080}

# Carga el archivo .env (si existe) como propiedades: funciona al arrancar desde API-CRUD/ o desde la raíz.
# Las variables de entorno del sistema tienen prioridad sobre .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- Base de datos (PostgreSQL) ----------
# En Azure: SPRING_DATASOURCE_URL=jdbc:postgresql://<servidor>.postgres.database.azure.com:5432/rodar_cuentas?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rodar_cuentas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Sin valor por defecto: la clave solo vive en .env o en las variables de entorno.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# El servidor de Azure es compartido: pocas conexiones por instancia.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# El esquema lo crea Flyway; Hibernate solo verifica que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---------- Gateway ----------
# Cabecera secreta que agrega el API Gateway. Si GATEWAY_SECRET esta vacio, el filtro no bloquea (solo desarrollo).
gateway.secreto.cabecera=X-Gateway-Secret
gateway.secreto.valor=${GATEWAY_SECRET:}

# Respeta X-Forwarded-* del gateway (p. ej. el prefijo /cuentas) al construir la cabecera Location.
server.forward-headers-strategy=framework

# ---------- JSON ----------
# El contrato declara additionalProperties: false y montos enteros.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
